<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="gestionMorosos">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5>Músicos morosos</h5>
            <span class="badge bg-danger" th:text="${#lists.size(morosos)} + ' moroso(s)'"></span>
        </div>
        <div class="table-responsive" style="max-height: 650px; overflow-y: auto;">
        <table class="table table-striped table-hover align-middle">
            <thead>
                <tr>
                    <th>Músico</th>
                    <th>Banda</th>
                    <th>Cuota mensual</th>
                    <th>Total pagado</th>
                    <th>Último pago</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${morosos}">
                    <td th:text="${m.nombreMusico}"></td>
                    <td th:text="${m.nombreBanda}"></td>
                    <td th:text="${'₡' + #numbers.formatDecimal(m.montoCuota, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${'₡' + #numbers.formatDecimal(m.totalPagado, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${m.fechaUltimoPago != null} ? ${#temporals.format(m.fechaUltimoPago, 'dd/MM/yyyy')} : 'Nunca'"></td>
                    <td>
                        <button type="button" class="btn btn-sm btn-outline-success" data-bs-toggle="modal" th:data-bs-target="'#modalPagarMoroso-' + ${m.cedula}">
                            <i class="ti ti-cash"></i> Pagar
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(morosos)}">
                    <td colspan="6" class="text-center text-muted">No hay músicos morosos. 🎉</td>
                </tr>
            </tbody>
        </table>
        </div>

        <div class="modal fade" th:each="m : ${morosos}" th:id="'modalPagarMoroso-' + ${m.cedula}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/estadoCuenta/pagar}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title">Registrar pago de <span th:text="${m.nombreMusico}"></span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="cedula" th:value="${m.cedula}">
                            <input type="hidden" name="returnTo" value="/morosos/listado">
                            <div class="mb-3">
                                <label class="form-label">Monto</label>
                                <input type="number" step="0.01" name="monto" class="form-control"
                                       th:placeholder="'Dejar vacío para usar la cuota de la banda (₡' + ${#numbers.formatDecimal(m.montoCuota, 1, 'COMMA', 2, 'POINT')} + ')'">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-success">Registrar pago</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
