<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <div th:fragment="gestionEventos">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <div class="d-flex align-items-center gap-3">

                    <h5 class="mb-0">
                        Eventos
                    </h5>

                    <input type="text"
                           id="buscarEvento"
                           class="form-control"
                           placeholder="Buscar evento por nombre..."
                           style="width: 300px;">

                    <button type="button"
                            id="btnBuscarEvento"
                            class="btn btn-primary btn-sm">
                        <i class="ti ti-search"></i>
                        Buscar
                    </button>

                </div>

                <button type="button"
                        class="btn btn-primary btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#modalNuevoEvento">

                    <i class="ti ti-plus"></i>
                    Nuevo evento

                </button>

            </div>

            <div class="table-responsive" style="max-height: 650px; overflow-y: auto;">
                <table id="tablaEventos" class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Evento</th>
                            <th>Fecha</th>
                            <th>Dirección</th>
                            <th>Banda</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${listaEventos}" th:attr="data-nombre-evento=${e.nombre}">
                            <td th:text="${e.nombre}"></td>
                            <td th:text="${e.fecha}"></td>
                            <td th:text="${e.direccion}"></td>
                            <td th:text="${e.nombreBanda}"></td>
                            <td th:text="${e.estado}"></td>
                            <td>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary js-editar-evento"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalEditarEvento"

                                    th:data-id="${e.idEvento}"
                                    th:data-nombre="${e.nombre}"
                                    th:data-detalle="${e.detalle}"
                                    th:data-fecha="${e.fecha}"
                                    th:data-direccion="${e.idDireccion}"
                                    th:data-banda="${e.idBanda}"
                                    th:data-estado="${e.idEstado}">

                                    <i class="ti ti-edit"></i>

                                </button>

                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    data-bs-target="#modalEliminarEvento"
                                    th:data-id="${e.idEvento}">
                                    <i class="ti ti-trash"></i>

                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaEventos)}">
                            <td colspan="6" class="text-center text-muted">No hay eventos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal: Nuevo evento -->
            <div class="modal fade" id="modalNuevoEvento" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">

                        <form th:action="@{/eventos/guardar}"
                              th:object="${evento}"
                              method="post">

                            <div class="modal-header">
                                <h5 class="modal-title">Nuevo evento</h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body">

                                <!-- Nombre -->
                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required>
                                </div>

                                <!-- Banda -->
                                <div class="mb-3">
                                    <label class="form-label">Banda</label>

                                    <select class="form-select"
                                            th:field="*{idBanda}"
                                            required>

                                        <option value="">-- Seleccione una banda --</option>

                                        <option th:each="b : ${bandas}"
                                                th:value="${b.idBanda}"
                                                th:text="${b.nombre}">
                                        </option>

                                    </select>
                                </div>

                                <!-- Detalle -->
                                <div class="mb-3">
                                    <label class="form-label">Detalle</label>

                                    <textarea class="form-control"
                                              rows="4"
                                              th:field="*{detalle}">
                                    </textarea>
                                </div>

                                <!-- Fecha -->
                                <div class="mb-3">
                                    <label class="form-label">Fecha</label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{fecha}"
                                           required>
                                </div>

                                <!-- Dirección -->
                                <div class="mb-3">
                                    <label class="form-label">Dirección</label>

                                    <select class="form-select"
                                            th:field="*{idDireccion}"
                                            required>

                                        <option value="">-- Seleccione una dirección --</option>

                                        <option
                                            th:each="d : ${direcciones}"
                                            th:value="${d.idDireccion}"
                                            th:text="${d.otrosDetalles}">
                                        </option>

                                    </select>
                                </div>


                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cancelar
                                </button>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Guardar
                                </button>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <!-- Modal: Editar evento -->
            <div class="modal fade" id="modalEditarEvento" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">

                        <form th:action="@{/eventos/actualizar}"
                              th:object="${evento}"
                              method="post">

                            <!-- ID oculto -->
                            <input type="hidden" th:field="*{idEvento}">

                            <div class="modal-header">
                                <h5 class="modal-title">Editar evento</h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body">

                                <!-- Nombre -->
                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required>
                                </div>

                                <!-- Banda -->
                                <div class="mb-3">
                                    <label class="form-label">Banda</label>

                                    <select class="form-select"
                                            th:field="*{idBanda}"
                                            required>

                                        <option value="">-- Seleccione una banda --</option>

                                        <option th:each="b : ${bandas}"
                                                th:value="${b.idBanda}"
                                                th:text="${b.nombre}">
                                        </option>

                                    </select>
                                </div>

                                <!-- Detalle -->
                                <div class="mb-3">
                                    <label class="form-label">Detalle</label>

                                    <textarea class="form-control"
                                              rows="4"
                                              th:field="*{detalle}">
                                    </textarea>
                                </div>

                                <!-- Fecha -->
                                <div class="mb-3">
                                    <label class="form-label">Fecha</label>

                                    <input type="date"
                                           class="form-control"
                                           th:field="*{fecha}"
                                           required>
                                </div>

                                <!-- Dirección -->
                                <div class="mb-3">
                                    <label class="form-label">Dirección</label>

                                    <select class="form-select"
                                            th:field="*{idDireccion}"
                                            required>

                                        <option value="">-- Seleccione una dirección --</option>

                                        <option th:each="d : ${direcciones}"
                                                th:value="${d.idDireccion}"
                                                th:text="${d.otrosDetalles}">
                                        </option>

                                    </select>
                                </div>

                                <!-- Estado -->
                                <div class="mb-3">
                                    <label class="form-label">Estado</label>

                                    <select class="form-select"
                                            th:field="*{idEstado}"
                                            required>

                                        <option value="">-- Seleccione un estado --</option>

                                        <option th:each="e : ${estados}"
                                                th:value="${e.idEstado}"
                                                th:text="${e.estado}">
                                        </option>

                                    </select>
                                </div>

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cancelar
                                </button>

                                <button type="submit"
                                        class="btn btn-primary">
                                    Actualizar
                                </button>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <!-- Modal: Eliminar evento -->
            <div class="modal fade" id="modalEliminarEvento" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <form th:action="@{/eventos/eliminar}"
                              method="post">

                            <input type="hidden"
                                   id="idEventoEliminar"
                                   name="idEvento">

                            <div class="modal-header bg-danger text-white">
                                <h5 class="modal-title">Eliminar evento</h5>

                                <button type="button"
                                        class="btn-close btn-close-white"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body text-center">

                                <i class="ti ti-alert-triangle text-danger"
                                   style="font-size: 60px;"></i>

                                <h5 class="mt-3">
                                    ¿Desea eliminar este evento?
                                </h5>

                                <p class="text-muted">
                                    Esta acción no se puede deshacer.
                                </p>

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cancelar
                                </button>

                                <button type="submit"
                                        class="btn btn-danger">
                                    Eliminar
                                </button>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

            <script>

                document.addEventListener("DOMContentLoaded", function () {

                    const input = document.getElementById("buscarEvento");
                    const boton = document.getElementById("btnBuscarEvento");

                    boton.addEventListener("click", function () {

                        const texto = input.value.toLowerCase().trim();

                        const filas = document.querySelectorAll(
                                "#tablaEventos tbody tr[data-nombre-evento]"
                                );

                        filas.forEach(function (fila) {

                            const nombre = fila
                                    .getAttribute("data-nombre-evento")
                                    .toLowerCase();

                            if (nombre.includes(texto)) {
                                fila.style.display = "";
                            } else {
                                fila.style.display = "none";
                            }

                        });

                    });

                });

            </script>

        </div>
    </body>
</html>
