<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="reporteBalance">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5>Balance por período</h5>
        </div>

        <form th:action="@{/balance/reporte}" method="get" class="row g-3 align-items-end mb-4">
            <div class="col-md-4">
                <label class="form-label">Banda</label>
                <select class="form-select" name="idBanda" required>
                    <option value="">-- Seleccione --</option>
                    <option th:each="b : ${bandas}" th:value="${b.idBanda}" th:text="${b.nombre}"
                            th:selected="${idBandaSel != null and idBandaSel == b.idBanda}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Desde</label>
                <input type="date" class="form-control" name="fechaInicio" th:value="${fechaInicioSel}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Hasta</label>
                <input type="date" class="form-control" name="fechaFin" th:value="${fechaFinSel}" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="ti ti-search"></i> Calcular
                </button>
            </div>
        </form>

        <div th:if="${total != null}">
            <div class="alert" th:classappend="${total.signum() >= 0} ? 'alert-success' : 'alert-danger'">
                <strong>Balance del período:</strong>
                <span th:text="${'₡' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></span>
                <span th:if="${total.signum() < 0}">(gastos superan a los ingresos)</span>
            </div>

            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th>Categoría</th>
                        <th>Tipo</th>
                        <th># Movimientos</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${detalle}">
                        <td th:text="${d.nombreCategoria}"></td>
                        <td>
                            <span class="badge" th:classappend="${d.tipo == 'Ingreso'} ? 'bg-success' : 'bg-danger'" th:text="${d.tipo}"></span>
                        </td>
                        <td th:text="${d.cantidadMovimientos}"></td>
                        <td th:text="${'₡' + #numbers.formatDecimal(d.total, 1, 'COMMA', 2, 'POINT')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(detalle)}">
                        <td colspan="4" class="text-center text-muted">No hay movimientos en ese período.</td>
                    </tr>
                </tbody>
            </table>
            </div>
        </div>

        <p class="text-muted" th:if="${total == null}">
            Elegí una banda y un rango de fechas para calcular el balance.
        </p>

    </div>
</body>
</html>
