<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header>
            <div class="Center">
                <div class="site-logo">
                    <h1><a th:href="@{/}">BandCore</a></h1>
                </div>

                <nav class="Navigation">
                    <ul>
                        <li>                                
                            <a th:href="@{/}">Inicio</a>
                            <span class="menu-item-bg"></span>
                        </li>
                        <li>                                
                            <a th:href="@{/audiciones/listado}">Audiciones</a>
                            <span class="menu-item-bg"></span>
                        </li>
                        <li>
                            <a th:href="@{/banda/listado}">Banda</a>
                            <span class="menu-item-bg"></span>
                        </li>
                        <li class="active">
                            <a th:href="@{/eventos/listado}">Eventos</a>
                            <span class="menu-item-bg"></span>
                        </li>
                        <li>
                            <a th:href="@{/suscripcion/listado}">Suscripción</a>
                            <span class="menu-item-bg"></span>
                        </li>
                    </ul>
                </nav>

                <div id="mobile_sec">
                    <div class="mobile"><i class="fa fa-bars"></i><i class="fa fa-times"></i></div>
                </div>

                <div class="clear"></div>
            </div>
        </header>
        <main class="container my-4 principal">

            <section class="evento-hero mb-5 text-center">

                <div class="evento-icono">
                    🎺
                </div>

                <h1 class="evento-titulo">
                    Eventos de la Banda
                </h1>

                <p class="evento-subtitulo">
                    Consulta las presentaciones, próximos eventos y actividades
                    programadas de la banda.
                </p>

            </section>

            <section class="mb-5">

                <h3 class="texto mb-4">
                    Resumen de eventos
                </h3>

                <div class="row g-4">

                    <div class="col-lg-6">

                        <div class="stats-card text-center">

                            <h5 class="mb-4">
                                Próximos eventos
                            </h5>

                            <div class="stats-number">
                                5
                            </div>

                            <p class="stats-text">
                                Eventos programados próximamente.
                            </p>

                        </div>

                    </div>

                    <div class="col-lg-6">

                        <div class="stats-card">

                            <h5 class="mb-4">
                                Buscar evento
                            </h5>

                            <select class="form-select mb-3">

                                <option>
                                    Seleccione un evento
                                </option>

                            </select>

                            <button class="btn evento-btn">
                                Ver información
                            </button>

                        </div>

                    </div>

                </div>

            </section>


        </main>


        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
