<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <div th:fragment="gestionEventos">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5>Eventos</h5>
                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoEvento">
                    <i class="ti ti-plus"></i> Nuevo evento
                </button>
            </div>

            <div class="table-responsive" style="max-height: 650px; overflow-y: auto;">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Evento</th>
                            <th>Fecha</th>
                            <th>Dirección</th>
                            <th>Banda</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${listaEventos}">
                            <td th:text="${e.nombre}"></td>
                            <td th:text="${e.fecha}"></td>
                            <td th:text="${e.direccion}"></td>
                            <td th:text="${e.nombreBanda}"></td>
                            <td th:text="${e.estado}"></td>
                            <td>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#modalEditar-' + ${e.idEvento}">

                                    <i class="ti ti-edit"></i>

                                </button>

                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#modalEliminar-' + ${e.idEvento}">

                                    <i class="ti ti-trash"></i>

                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaEventos)}">
                            <td colspan="6" class="text-center text-muted">No hay eventos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal: nuevo evento -->
            <div class="modal fade" id="modalNuevoEvento" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">

                        <form th:action="@{/eventos/guardar}"
                              th:object="${evento}"
                              method="post">

                            <div class="modal-header">
                                <h5 class="modal-title">Nuevo evento</h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>
                            </div>

                            <div class="modal-body">

                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input
                                        class="form-control"
                                        type="text"
                                        th:field="*{nombre}"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Banda</label>

                                    <select class="form-select" th:field="*{idBanda}" required>
                                        <option value="">-- Seleccione una banda --</option>

                                        <option
                                            th:each="b : ${bandas}"
                                            th:value="${b.idBanda}"
                                            th:text="${b.nombre}">
                                        </option>

                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Detalle</label>

                                    <textarea
                                        class="form-control"
                                        rows="3"
                                        th:field="*{detalle}">
                                    </textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Fecha</label>

                                    <input
                                        class="form-control"
                                        type="date"
                                        th:field="*{fecha}"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Provincia</label>

                                    <select class="form-select" th:field="*{idProvincia}" required>

                                        <option value="">-- Seleccione una provincia --</option>

                                        <option
                                            th:each="p : ${provincias}"
                                            th:value="${p.idProvincia}"
                                            th:text="${p.nombre}">
                                        </option>

                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Cantón</label>

                                    <select class="form-select" th:field="*{idCanton}" required>

                                        <option value="">-- Seleccione un cantón --</option>

                                        <option
                                            th:each="c : ${cantones}"
                                            th:value="${c.idCanton}"
                                            th:text="${c.nombre}">
                                        </option>

                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Distrito</label>

                                    <select class="form-select" th:field="*{idDistrito}" required>

                                        <option value="">-- Seleccione un distrito --</option>

                                        <option
                                            th:each="d : ${distritos}"
                                            th:value="${d.idDistrito}"
                                            th:text="${d.nombre}">
                                        </option>

                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Otros detalles</label>

                                    <textarea
                                        class="form-control"
                                        rows="2"
                                        th:field="*{otrosDetalles}"
                                        placeholder="Ejemplo: 150 metros norte del parque central">
                                    </textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Estado</label>

                                    <select class="form-select" th:field="*{idEstado}" required>
                                        <option value="">-- Seleccione un estado --</option>

                                        <option
                                            th:each="e : ${estados}"
                                            th:value="${e.idEstado}"
                                            th:text="${e.estado}">
                                        </option>

                                    </select>
                                </div>

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cancelar
                                </button>

                                <button class="btn btn-primary"
                                        type="submit">
                                    Guardar
                                </button>

                            </div>

                        </form>

                    </div>
                </div>
            </div>


            <!-- Modal: editar instrumento (uno por fila) -->


            <!-- Modal: confirmar eliminación (uno por fila) -->


        </div>
    </body>
</html>
