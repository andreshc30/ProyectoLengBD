<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <th:block th:replace="~{general/fragmentos :: head}"></th:block>
</head>
<body>
<header>
    <div class="Center">
        <div class="site-logo"><h1><a th:href="@{/}">BandCore</a></h1></div>
    </div>
</header>

<section>
    <div id="wrapper">
        <div th:replace="~{general/fragmentos :: sidebar('')}"></div>

        <div id="content-wrapper" class="d-flex flex-column w-100">
            <div id="content">
                <div class="container-fluid mt-4">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800"
                            th:text="${obra.idObra != null} ? 'Editar Obra' : 'Nueva Obra'">Nueva Obra</h1>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <form th:action="@{/obra/guardarD}" method="post">
                                <input type="hidden" name="idObra" th:value="${obra.idObra}">
                                <input type="hidden" name="idEstado" th:value="${obra.idEstado != null ? obra.idEstado : 1}">

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nombre</label>
                                    <input type="text" class="form-control" name="nombre" th:value="${obra.nombre}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Tipo</label>
                                    <select class="form-select" name="idTipo">
                                        <option value="">-- Seleccione tipo --</option>
                                        <option th:each="t : ${tipos}"
                                                th:value="${t.idTipo}"
                                                th:text="${t.nombre}"
                                                th:selected="${obra.idTipo != null and obra.idTipo == t.idTipo}"></option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Fecha</label>
                                    <input type="date" class="form-control" name="fecha"
                                           th:value="${obra.fecha}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Detalle</label>
                                    <textarea class="form-control" name="detalle" rows="2" th:text="${obra.detalle}"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Enlace del material (YouTube, Drive, etc.)</label>
                                    <input type="url" class="form-control" name="rutaObra"
                                           th:value="${obra.rutaObra}" placeholder="https://...">
                                </div>

                                <div class="d-flex justify-content-end">
                                    <a th:href="@{/banda/secciones/listadoDirector}" class="btn btn-secondary me-2">Cancelar</a>
                                    <button type="submit" class="btn btn-success">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<th:block th:replace="~{general/fragmentos :: footer}"></th:block>
</body>
</html>
