<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <th:block th:replace="~{general/fragmentos :: head}"></th:block>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    </head>
    <body>
        <header>
            <div class="Center">
                <div class="site-logo">
                    <h1><a th:href="@{/}">BandCore</a></h1>
                </div>
                <nav class="Navigation">
                    <ul>
                        <li><a th:href="@{/}">Inicio</a><span class="menu-item-bg"></span></li>
                        <li><a th:href="@{/audiciones/listado}">Audiciones</a><span class="menu-item-bg"></span></li>
                        <li><a th:href="@{/banda/listado}">Banda</a><span class="menu-item-bg"></span></li>
                        <li><a th:href="@{/eventos/listado}">Eventos</a><span class="menu-item-bg"></span></li>
                        <li><a th:href="@{/suscripcion/listado}">Suscripción</a><span class="menu-item-bg"></span></li>
                        <li class="active"><a th:href="@{/minisite/configuracion}">Mi Minisite</a><span class="menu-item-bg"></span></li>
                    </ul>
                </nav>
                <div id="mobile_sec"><div class="mobile"><i class="fa fa-bars"></i><i class="fa fa-times"></i></div></div>
                <div class="clear"></div>
            </div>
        </header>

        <main class="container my-4 principal">

            <div th:replace="~{minisite/fragmentos :: heroMinisite('📅', 'Próximos eventos', 'Las actividades programadas de ' + ${banda.nombre} + '.')}"></div>
            <div th:replace="~{minisite/fragmentos :: subnav('eventos')}"></div>

            <section class="row g-4">
                <div class="col-lg-4" th:each="evento : ${eventos}">
                    <div class="presentacion-card">
                        <div class="presentacion-icono">🎺</div>
                        <h5 th:text="${evento.nombre}">Nombre del evento</h5>
                        <p class="evento-fecha">
                            📅 <span th:text="${#temporals.format(evento.fecha, 'dd/MM/yyyy')}"></span>
                        </p>
                        <p class="evento-nombre" th:text="${evento.detalle}">Detalle</p>
                    </div>
                </div>
                <div class="col-12" th:if="${#lists.isEmpty(eventos)}">
                    <p class="text-center text-muted">No hay próximos eventos programados.</p>
                </div>
            </section>

        </main>

        <th:block th:replace="~{general/fragmentos :: footer}"></th:block>
    </body>
</html>
